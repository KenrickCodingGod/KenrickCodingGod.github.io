<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenrick Kock | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <nav aria-label="Hoofdnavigatie">
        <a href="index.html">Whoami</a>
        <a href="projects.html">Projecten</a>
        <a href="blog.html">Blog</a>
    </nav>
</header>

<main>
    <section>
        <h1>Who am I?</h1>
        <img src="images/whoami.JPG"
             alt="Kenrick Kock naast Shrek"
             class="profile-photo">
        <p>
            Mijn naam is Kenrick Kock. Ik studeer Software Engineering
            aan De Haagse Hogeschool. Ik ben tweedejaars student.
        </p>
    </section>

    <section class="page-section" aria-labelledby="contact-title">
        <h2 id="contact-title">Contact</h2>
        <p>Wil je contact opnemen? Vul dan hieronder je gegevens en bericht in.</p>

        <form id="contact-form" novalidate>
            <div class="form-field">
                <label for="name">Naam</label>
                <input type="text" id="name" name="name"
                       aria-describedby="name-error">
                <p class="error-message" id="name-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       aria-describedby="email-error">
                <p class="error-message" id="email-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
                <label for="message">Bericht</label>
                <textarea id="message" name="message" rows="5"
                          aria-describedby="message-error"></textarea>
                <p class="error-message" id="message-error" aria-live="polite"></p>
            </div>

            <button type="submit">Controleren</button>
            <p id="form-status" class="form-status" aria-live="polite"></p>
        </form>
    </section>
</main>

<footer>
    <p>Kenrick Kock - 2026/2027 HBO-ICT</p>
</footer>
<script src="js/contact.js"></script>
</body>
</html>
